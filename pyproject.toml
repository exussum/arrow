[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling >= 1.26",
]

[project]
dependencies = [
    "Pillow==12.3.0",
    "command-cfg==1.1.0",
    "requests==2.33.0",
    "streamdeck==0.9.8",
]
name = "arrow"
version = "0.0.1"
requires-python = ">=3.14"

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]
lint = [
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "ruff==0.16.4",
    "semgrep==1.171.0",
]
[project.scripts]
arrow = "arrow.runner:main"

[tool.uv.sources]
command-cfg = { git = "https://github.com/exussum/command-cfg", tag = "v1.1.0" }

[tool.ruff]
line-length = 140
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-third-party = ["StreamDeck"]

[tool.mypy]
files = ["src/arrow"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/arrow"]
include = [
    "src/arrow/**/*.py",
    "src/arrow/icons/**/*.png",
    "src/arrow/icons/**/*.gif",
    "src/arrow/fonts/*.ttf",
    "src/arrow/fonts/LICENSE-*.txt",
    "src/arrow/config.arrow",
]

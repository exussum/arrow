[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling >= 1.26",
]

[project]
dependencies = [
    "Pillow==12.3.0",
    "streamdeck==0.9.8",
]
name = "arrow"
version = "0.0.1"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]
lint = [
    "black==26.5.1",
    "isort==8.0.1",
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "semgrep==1.169.0",
]
build = [
    "twine==6.2.0",
    "build==1.5.0",
]

[project.scripts]
arrow = "arrow.runner:main"

[tool.black]
line-length = 140

[tool.isort]
profile = "black"
src_paths = ["src/arrow"]
known_third_party = ["StreamDeck"]

[tool.mypy]
files = ["src/arrow"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/arrow"]
include = [
    "src/arrow/**/*.py",
    "src/arrow/icons/**/*.png",
    "src/arrow/icons/**/*.gif",
]

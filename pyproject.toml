[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling >= 1.26",
]

[project]
dependencies = [
    "Pillow==12.2.0",
    "streamdeck==0.9.5",
]
name = "arrow"
version = "0.0.1"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
]
lint = [
    "black==26.5.1",
    "isort==8.0.1",
    "pyflakes==3.4.0",
]
build = [
    "twine==6.2.0",
    "build==1.5.0",
]

[project.scripts]
arrow = "arrow.runner:main"

[tool.black]
line-length = 140

[tool.isort]
profile = "black"
src_paths = ["src/arrow"]
known_third_party = ["StreamDeck"]

[tool.hatch.build.targets.wheel]
packages = ["src/arrow"]
include = [
    "src/arrow/**/*.py",
    "src/arrow/icons/**/*.png",
    "src/arrow/icons/**/*.gif",
]
